##  GitHub Actions: on every push and pull request, run the same Linux
##  checks as before a push (support/docker-linux-checks.sh -c): the
##  Debian image from support/docker/Dockerfile.linux, CMake alone, ctest,
##  support/verify-cxx.sh and the live innd checks, on the pushed commit.

name: build

"on": [push, pull_request]

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: checkout
        uses: actions/checkout@v6
      - name: linux checks
        run: support/docker-linux-checks.sh -c
